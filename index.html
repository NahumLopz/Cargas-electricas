<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Cargas Eléctricas</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
<div class="header">
<div><h1>⚡ <span>Coulomb</span>Sim</h1><div class="sub">Simulador de cargas eléctricas puntuales · Ley de Coulomb</div></div>
<div class="mode-toggle">
<button class="mode-btn active" data-mode="2d">2D</button>
<button class="mode-btn" data-mode="1d">1D</button>
</div>
</div>
<div class="main">
<div class="canvas-wrap">
<div class="canvas-frame">
<canvas id="canvas" width="840" height="600"></canvas>
</div>
</div>
<div class="sidebar">
<div class="sidebar-section">
<div class="section-title">Cargas</div>
<div class="charge-list" id="chargeList"></div>
<div class="actions mt-8">
<button class="btn btn-primary btn-small" id="btnAddCharge">+ Añadir</button>
<button class="btn btn-danger btn-small" id="btnDelCharge">Eliminar</button>
</div>
</div>
<div class="sidebar-section">
<div class="section-title">Propiedades de la carga seleccionada</div>
<div class="form-grid">
<div class="form-group"><label>X (m)</label><input type="number" id="editX" step="0.1"></div>
<div class="form-group"><label>Y (m)</label><input type="number" id="editY" step="0.1"></div>
<div class="form-group full"><label>Carga (μC)</label><input type="number" id="editQ" step="0.1"></div>
</div>
<button class="btn btn-secondary btn-small mt-8" id="btnUpdate">Actualizar</button>
</div>
<div class="sidebar-section">
<div class="section-title">Visualización</div>
<div class="checkbox-row"><input type="checkbox" id="chkForces" checked><label for="chkForces">Mostrar fuerzas sobre carga seleccionada</label></div>
  <div class="checkbox-row"><input type="checkbox" id="chkField"><label for="chkField">Mostrar campo eléctrico en punto</label></div>
  <div class="checkbox-row"><input type="checkbox" id="chkFieldLines"><label for="chkFieldLines">Mostrar líneas de campo (rojo)</label></div>
</div>
<div class="sidebar-section">
<div class="section-title">Campo eléctrico en un punto</div>
<div class="form-grid">
<div class="form-group"><label>X (m)</label><input type="number" id="fieldX" step="0.1" value="0"></div>
<div class="form-group"><label>Y (m)</label><input type="number" id="fieldY" step="0.1" value="0"></div>
</div>

<button class="btn btn-secondary btn-small" id="btnClearSelection">
    Limpiar selección
</button>

<button class="btn btn-success btn-small mt-8" id="btnCalcField">Calcular E</button>
<button class="btn btn-secondary btn-small mt-8" id="btnClearField">Limpiar</button>
</div>
<div class="sidebar-section">
<div class="section-title">Resultados</div>
<div class="results-box" id="resultsBox">
<div class="label">Selecciona una carga o calcula el campo</div>
</div>
</div>
</div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
